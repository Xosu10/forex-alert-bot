name: Forex Factory USD Alert Bot

on:
  schedule:
    - cron: '*/5 * * * *'
    # Aviso: el "schedule" de GitHub Actions no es fiable a esta frecuencia (puede tardar horas).
    # Se mantiene como respaldo; el disparo real y puntual llega por workflow_dispatch desde cron-job.org.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REMINDER_MINUTES_BEFORE: ${{ vars.REMINDER_MINUTES_BEFORE }}
          ALERT_MINUTES_BEFORE: ${{ vars.ALERT_MINUTES_BEFORE }}
          ACTUAL_CHECK_WINDOW_MINUTES: ${{ vars.ACTUAL_CHECK_WINDOW_MINUTES }}
          SUMMARY_HOUR: ${{ vars.SUMMARY_HOUR }}
        run: python main.py

      - name: Guardar el registro de avisos ya enviados
        run: |
          git config user.name "forex-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.db
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Actualizar registro de avisos enviados"
            git push || (git pull --rebase && git push)
          fi
